<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Request Authorization Flow</title>
  <desc id="flow-desc">Flowchart showing how an incoming request is checked for authentication, then authorization, before reaching the handler.</desc>
  <style>
    .box { fill: none; stroke: #3a3a3a; stroke-width: 1; rx: 4; }
    .box-accent { fill: #fef8f4; stroke: #eb6c36; stroke-width: 1.5; rx: 4; }
    .diamond { fill: none; stroke: #3a3a3a; stroke-width: 1; }
    .lbl { font-family: 'Geist', system-ui, sans-serif; font-size: 12px; fill: #1a1a1a; text-anchor: middle; }
    .lbl-accent { font-family: 'Geist', system-ui, sans-serif; font-size: 12px; fill: #eb6c36; text-anchor: middle; font-weight: 500; }
    .lbl-mono { font-family: 'Geist Mono', monospace; font-size: 10px; fill: #787878; text-anchor: middle; }
    .edge-lbl { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #787878; }
    .edge { stroke: #c0c0c0; stroke-width: 1; fill: none; marker-end: url(#f-arrow); }
    .edge-no { stroke: #eb6c36; stroke-width: 1; fill: none; marker-end: url(#f-arrow-a); }
  </style>
  <defs>
    <marker id="f-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L7,4 L0,7" fill="none" stroke="#c0c0c0" stroke-width="1.2"/></marker>
    <marker id="f-arrow-a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L7,4 L0,7" fill="none" stroke="#eb6c36" stroke-width="1.2"/></marker>
  </defs>

  <!-- Start -->
  <rect x="260" y="16" width="120" height="40" class="box"/>
  <text x="320" y="41" class="lbl">Incoming Request</text>

  <!-- Edge -->
  <line x1="320" y1="56" x2="320" y2="92" class="edge"/>

  <!-- Diamond: Authenticated? -->
  <polygon points="320,92 396,132 320,172 244,132" class="diamond"/>
  <text x="320" y="136" class="lbl">Authenticated?</text>

  <!-- YES path -->
  <line x1="396" y1="132" x2="460" y2="132" class="edge"/>
  <text x="420" y="124" class="edge-lbl">yes</text>

  <!-- Diamond: Authorized? -->
  <polygon points="536,92 612,132 536,172 460,132" class="diamond"/>
  <text x="536" y="136" class="lbl">Authorized?</text>

  <!-- YES → Handler -->
  <line x1="536" y1="172" x2="536" y2="220" class="edge"/>
  <text x="548" y="200" class="edge-lbl">yes</text>
  <rect x="476" y="220" width="120" height="40" class="box-accent"/>
  <text x="536" y="241" class="lbl-accent">Handle Request</text>
  <text x="536" y="255" class="lbl-mono">200 OK</text>

  <!-- NO from Authorized → 403 -->
  <line x1="612" y1="132" x2="612" y2="220" class="edge-no"/>
  <text x="620" y="172" class="edge-lbl">no</text>
  <rect x="564" y="304" width="96" height="36" class="box"/>
  <text x="612" y="326" class="lbl">403 Forbidden</text>
  <line x1="612" y1="220" x2="612" y2="304" class="edge-no"/>

  <!-- NO from Authenticated → 401 -->
  <line x1="320" y1="172" x2="320" y2="304" class="edge-no"/>
  <text x="332" y="240" class="edge-lbl">no</text>
  <rect x="272" y="304" width="96" height="36" class="box"/>
  <text x="320" y="326" class="lbl">401 Unauthorized</text>
</svg>
